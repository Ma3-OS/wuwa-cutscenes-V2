[package]
name = "wuwa-pak-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
unpak = { path = "../tauri-app/src-tauri/unpak-patched", features = ["encryption", "compression"] }
aes = "0.9.2"
